<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" role="img" aria-label="Árvores em sequência: cada uma corrige o erro da anterior, e o resultado é a soma de todas">
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #182638; text-anchor: middle; }
    .n { fill: #edf3fa; stroke: #2876c7; stroke-width: 1.3; }
    .l { stroke: #617187; stroke-width: 1.5; fill: none; marker-end: url(#s); }
    .p { font-size: 11px; fill: #617187; }
  </style>
  <defs><marker id="s" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#617187"/></marker></defs>
  <rect class="n" x="10" y="44" width="84" height="38" rx="8"/><text x="52" y="68">árvore 1</text>
  <path class="l" d="M94 63 H114"/><text class="p" x="104" y="36">corrige</text><text class="p" x="104" y="24">erro</text>
  <rect class="n" x="118" y="44" width="84" height="38" rx="8"/><text x="160" y="68">árvore 2</text>
  <path class="l" d="M202 63 H222"/><text class="p" x="212" y="36">corrige</text><text class="p" x="212" y="24">erro</text>
  <rect class="n" x="226" y="44" width="84" height="38" rx="8"/><text x="268" y="68">árvore 3</text>
  <path class="l" d="M310 63 H330"/>
  <rect x="334" y="44" width="76" height="38" rx="8" fill="#10243b"/><text x="372" y="68" style="fill:#ffffff">soma</text>
  <rect x="42" y="130" width="130" height="8" rx="4" fill="#c34e55"/><rect x="42" y="150" width="70" height="8" rx="4" fill="#bd8420"/><rect x="42" y="170" width="28" height="8" rx="4" fill="#23866d"/>
  <text class="p" x="240" y="138" style="text-anchor:start">erro depois da árvore 1</text>
  <text class="p" x="240" y="158" style="text-anchor:start">erro depois da árvore 2</text>
  <text class="p" x="240" y="178" style="text-anchor:start">erro depois da árvore 3</text>
  <path d="M178 134 H232 M118 154 H232 M76 174 H232" stroke="#dce5ef" stroke-width="1"/>
</svg>
