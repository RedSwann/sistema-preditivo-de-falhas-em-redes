<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" role="img" aria-label="Árvore de exemplo: perda alta leva a FALHA; senão jitter alto leva a RISCO; senão OK">
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #182638; text-anchor: middle; }
    .n { fill: #edf3fa; stroke: #2876c7; stroke-width: 1.3; }
    .l { stroke: #9bb1c8; stroke-width: 1.4; }
    .s { font-size: 11px; fill: #617187; }
    .b { font-weight: 800; font-size: 12px; }
  </style>
  <path class="l" d="M210 34 L100 86 M210 34 L305 86 M305 104 L235 160 M305 104 L375 160 M100 104 L100 160"/>
  <rect class="n" x="150" y="12" width="120" height="30" rx="8"/><text x="210" y="32">perda alta?</text>
  <text class="s" x="140" y="58">sim</text><text class="s" x="270" y="58">não</text>
  <rect x="62" y="84" width="76" height="26" rx="7" fill="#fde9e9"/><text class="b" x="100" y="102" style="fill:#a23840">FALHA</text>
  <rect class="n" x="245" y="84" width="120" height="30" rx="8"/><text x="305" y="104">jitter alto?</text>
  <text class="s" x="257" y="134">sim</text><text class="s" x="352" y="134">não</text>
  <rect x="197" y="160" width="76" height="26" rx="7" fill="#fff3d9"/><text class="b" x="235" y="178" style="fill:#8b5b08">RISCO</text>
  <rect x="337" y="160" width="76" height="26" rx="7" fill="#e4f5ed"/><text class="b" x="375" y="178" style="fill:#176b53">OK</text>
</svg>
